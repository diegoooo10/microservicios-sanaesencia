spring.application.name=usuario-service

server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sanaesencia_usuarios?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cambiar este secreto en cada entorno. Debe ser Base64 y contener al menos 256 bits.
app.jwt.secret=${JWT_SECRET:U2FuYUVzZW5jaWEtRGV2ZWxvcG1lbnQtU2VjcmV0LUtleS0yMDI2LUZvci1Mb2NhbC1Pbmx5}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
