
server:
  port: 8080

spring:
  application:
    name: api-gateway-sanaesencia

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Microservicio de Usuarios
            - id: usuario-service
              uri: ${USUARIO_SERVICE_URL:http://usuario-service:8081}
              predicates:
                - Path=/api/usuarios,/api/usuarios/**

            # Microservicio de Servicios
            - id: servicio-service
              uri: ${SERVICIO_SERVICE_URL:http://servicio-service:8082}
              predicates:
                - Path=/api/especialidades,/api/especialidades/**,/api/servicios,/api/servicios/**

            # Microservicio de Profesionales
            - id: profesional-service
              uri: ${PROFESIONAL_SERVICE_URL:http://profesional-service:8083}
              predicates:
                - Path=/api/profesionales,/api/profesionales/**

            # Microservicio de Reservas
            - id: reserva-service
              uri: ${RESERVA_SERVICE_URL:http://reserva-service:8084}
              predicates:
                - Path=/api/reservas,/api/reservas/**

            # Microservicio de Pagos
            - id: pago-service
              uri: http://pago-service:8085
              predicates:
                - Path=/api/pagos,/api/pagos/**

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
